services:
  - type: web
    name: job-bot-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: MAX_UPLOAD_MB
        value: "8"
      - key: FRONTEND_ORIGINS
        value: https://bucksmon.github.io
